# Run Jenkins itself as a container
# Usage: docker-compose -f docker-compose.jenkins.yml up -d

version: "3.9"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: foliox-jenkins
    restart: unless-stopped
    privileged: true                      # needed to run Docker inside Jenkins
    user: root
    ports:
      - "8080:8080"                       # Jenkins UI
      - "50000:50000"                     # Jenkins agents
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-Docker
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - foliox-net

networks:
  foliox-net:
    external: true                        # shared with app containers

volumes:
  jenkins_data:
