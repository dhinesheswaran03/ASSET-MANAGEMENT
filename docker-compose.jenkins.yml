version: "3.9"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: foliox-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock   # Docker socket for Windows
      - //usr/bin/docker:/usr/bin/docker             # Docker binary
    networks:
      - foliox-net

networks:
  foliox-net:
    external: true

volumes:
  jenkins_data:
